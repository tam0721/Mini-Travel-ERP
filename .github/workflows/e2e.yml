name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travel_erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/travel_erp_test
      JWT_SECRET: test-secret-for-ci-only
      PORT: 3000

    steps:
      - uses: actions/checkout@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      # ── Backend (ở root) ──────────────────────────────────────
      - name: Install root dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Seed test data
        run: node prisma/seeders/seed.test.js

      - name: Start backend
        run: node backend/src/server.js &

      # ── Frontend ─────────────────────────────────────────────
      - name: Install frontend
        run: npm ci
        working-directory: frontend

      # ── Cypress ──────────────────────────────────────────────
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: e2e
          start: npm run dev --prefix ../frontend
          wait-on: "http://localhost:5173, http://localhost:3000/api/health"
          wait-on-timeout: 120

      # ── Artifacts ────────────────────────────────────────────
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: e2e/cypress/screenshots
          retention-days: 7

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: e2e/cypress/videos
          retention-days: 3